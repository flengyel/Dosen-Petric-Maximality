fidelity:
  divergences: >-
    The production maximality theorem is universe-polymorphic and does not need
    the manuscript's nonempty-variable hypothesis. A registry wrapper may retain
    that hypothesis to state the printed theorem directly. The proposed compact
    raw congruence interface exposes the entire primitive grammar, generating
    equations and uniform substitution. Its exact relation to the manuscript's
    full quotient congruence, including the derived operations, must be proved
    before this proposal is installed as final metadata. Existing empty hom-sets
    and distinct occurrence tags are preserved. No new priority or exhaustive
    novelty assessment was performed during registration packaging.

