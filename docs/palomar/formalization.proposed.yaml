    location: Theorem 2.1; Sections 2–6; Appendices A–C; October 29, 2026.
    author_endorsement: participated
    note: >-
      The manuscript is retained with the substantive Lean development. This is
      source-based formalization of the manuscript's result. Its v8 mathematical
      content is unchanged from v7. The selected declarations and the broader
      complete-paper correspondence are identified separately below.
  - title: Proof-Theoretical Coherence
    authors: [Kosta Došen, Zoran Petrić]
    type: book
    relationship: formalizes
    id: https://www.mi.sanu.ac.rs/novi_sajt/biography/kosta/coh.pdf
    location: >-
      King's College Publications, 2004; revised author version September 2007;
      the zero-identity Boolean presentation in Sections 14.2–14.3 and the
      cut-elimination and coherence arguments used by that presentation.
    author_endorsement: not-contacted
    note: >-
      The development includes proofs of the cut-elimination and coherence inputs
      needed for the actual source category. It does not attribute the manuscript's
      maximality theorem to this book. Appendix C identifies two source rank
      corrections and gives their concrete formal correspondences.
  - title: Isomorphic formulae in classical propositional logic
    authors: [Kosta Došen, Zoran Petrić]
    type: paper
    relationship: background
    id: https://doi.org/10.1002/malq.201020020
    location: Mathematical Logic Quarterly 58 (2012), 5–17; Lemma 7; author version arXiv:0912.1271v3.
    author_endorsement: not-contacted
    note: >-
      The manuscript relates its particular q/e isomorphisms to the
      occurrence-bijection construction in Lemma 7. The actual arrows and their
      inverses are proved in the source category; no assumed isomorphism field
      replaces those constructions.

