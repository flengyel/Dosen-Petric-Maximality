version: v0.4
project:
  name: Maximality of the Došen–Petrić Boolean Category
  description: 'The freely generated zero-identity Boolean category of Došen and Petrić is maximal: every
    congruence preserved by the proof operations and uniform substitution is either equality or identifies
    every pair of parallel arrows. The Lean development constructs the equation-generated category and
    proves cut elimination and Boolean coherence, then proves maximality through both a symmetric-fold
    argument and the manuscript''s short argument using two particular isomorphisms. It also formalizes
    the model corollary and the occurrence-substitution, finite-ordinal and structural-diagram constructions
    in the appendices. The registry selection compares the two maximality proofs, the congruence dichotomy,
    a nonzero literal identity and the absence of arrows from the terminal object to the initial object.'
  authors:
  - Florian Lengyel
  responsible_maintainers:
  - Florian Lengyel
  license: Apache-2.0
