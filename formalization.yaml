fidelity:
  divergences: The three maximality statements retain the manuscript's nonempty-variable hypothesis; the
    underlying production theorems are stronger. The compact primitive congruence acts on actual typed
    raw terms and contains all generating equations. Uniform substitution acts on terms and both endpoints.
    PalomarCorrespondence proves descent to the actual quotient, the inverse restriction of full proof
    congruences, pointwise relation correspondence, substitution closure, totality and distinctness correspondence,
    and admissibility of derived negation. Its closed-class extension uses the previously proved fragment
    dichotomy. The selected short proof instead uses the fragment directly, actual source isolation, uniform
    contextual collapse and ShortProof.total with the particular q/e arrows. Empty hom-sets and distinct
    occurrence tags are preserved. No new priority or exhaustive novelty assessment was performed during
    packaging.
