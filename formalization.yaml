  statements:
  - source: Manuscript Theorem 2.1; alternative fold proof in Section 6
    lean: DosenPetric.Palomar.maximality
    module: Solution
    status: proved
    note: The source/fold proof uses the fully instantiated actual equation-generated presentation through
      fragment_maximality. Raw/quotient correspondence is proved in PalomarCorrespondence.
  - source: Manuscript Theorem 2.1; q/e proof in Section 5
    lean: DosenPetric.Palomar.short_maximality
    module: Solution
    status: proved
    note: The actual q/e proof uses normalized_literal_context, all_contexts and ShortProof.total directly,
      without invoking the fold maximality theorem or manufacturing totality through the full-congruence
      extension.
  - source: Manuscript Theorem 2.1, equality/total dichotomy
    lean: DosenPetric.Palomar.congruence_dichotomy
    module: Solution
    status: proved
    note: Generated equality is Derives; quotient equality, full congruence relations and totality have
      proved correspondence.
  - source: Manuscript Section 3, nonzero variable identity
    lean: DosenPetric.Palomar.identity_ne_zero
    module: Solution
    status: proved
    note: The actual quotient witness identity_ne_primitive_zero rules out generated equality with zero
      at each supplied variable.
  - source: Manuscript Sections 2–3, preservation of empty hom-sets
    lean: DosenPetric.Palomar.no_top_to_bot
    module: Solution
    status: proved
    note: The actual source truth interpretation proves that no raw term inhabits the terminal-to-initial
      hom-set.
