alignment:
  namespace: DosenPetric.Palomar
  statements:
  - source: Manuscript v13, Theorem 2.1; symmetric-fold proof in Section 6.
    lean: DosenPetric.Palomar.maximality
    module: Solution
    status: proved
    note: The symmetric-fold proof uses Presentation.fragment_maximality for the quotient by Derives.
      DosenPetric/PalomarCorrespondence.lean proves the relation correspondence between terms and quotient
      arrows.
  - source: Manuscript v13, Theorem 2.1; q_A/e_A proof in Sections 4–5.
    lean: DosenPetric.Palomar.short_maximality
    module: Solution
    status: proved
    note: The q_A/e_A proof uses Isolation.normalized_literal_context, ContextualCollapse.all_contexts
      and ShortProof.total. Its proof is independent of the invocation of fragment_maximality in the symmetric-fold
      proof.
  - source: Manuscript v13, Theorem 2.1, equality/totality dichotomy.
    lean: DosenPetric.Palomar.congruence_dichotomy
    module: Solution
    status: proved
    note: Equality of quotient arrows is the relation Derives on their representatives. The correspondence
      with full proof congruences and the preservation of totality are proved in DosenPetric/PalomarCorrespondence.lean.
  - source: Manuscript v13, Section 3, nonzero variable identity.
    lean: DosenPetric.Palomar.identity_ne_zero
    module: Solution
    status: proved
    note: Presentation.identity_ne_primitive_zero proves that the variable identity differs from the primitive
      zero endomorphism in the quotient by Derives.
  - source: Manuscript v13, Sections 2–3, empty terminal-to-initial hom-set.
    lean: DosenPetric.Palomar.no_top_to_bot
    module: Solution
    status: proved
    note: Presentation.empty_hom, proved by the truth interpretation, rules out any arrow term from the
      terminal object to the initial object.
