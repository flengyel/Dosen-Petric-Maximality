version: v0.4
project:
  name: Maximality of the Došen–Petrić Boolean Category
  description: 'Let P be a nonempty set of propositional variables. The freely generated zero-identity
    Boolean category B(P) of Došen and Petrić is maximal: every congruence on its arrows preserved by
    the arrow operations and uniform formula substitution is either equality or identifies every pair
    of parallel arrows. The formalization gives two proofs of maximality and proves the congruence dichotomy.
    It also proves that the identity and zero endomorphism of each variable are distinct, and that there
    is no arrow from the terminal object to the initial object.'
  authors:
  - Florian Lengyel
  responsible_maintainers:
  - Florian Lengyel
  license: Apache-2.0
