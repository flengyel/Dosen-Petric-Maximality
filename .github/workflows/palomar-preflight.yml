# Install as .github/workflows/palomar-preflight.yml in the finalized package.
# Dispatch only after the exact candidate is public with its agreed license.
name: Palomar full mechanical preflight

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full 40-character candidate commit to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  palomar-preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@14aa8d6b3c2f14a8540605e37144560b9a00e7e7
    with:
      repository: ${{ github.repository }}
      commit: ${{ inputs.commit }}
      pipeline_commit: 14aa8d6b3c2f14a8540605e37144560b9a00e7e7
      request_id: preflight001
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path":"comparator.json","authorization_relationship":"I am a responsible author or maintainer"}'
